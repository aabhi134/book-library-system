{% extends "base.html" %}

{% block title %}Add Book | Book Library{% endblock %}

{% block content %}

<div class="container" style="padding-top: 50px; max-width: 700px;">

    <div class="auth-card">

        <h1>Add a Book</h1>

        <p class="subtitle">
            Add a new book to your personal library.
        </p>

        <form method="POST">

            {% csrf_token %}

            <div class="form-group">
                <label>Book Title</label>
                <input
                    type="text"
                    name="title"
                    placeholder="Enter book title"
                    required
                >
            </div>

            <div class="form-group">
                <label>Author</label>
                <input
                    type="text"
                    name="author"
                    placeholder="Enter author name"
                    required
                >
            </div>

            <div class="form-group">
                <label>Genre</label>
                <input
                    type="text"
                    name="genre"
                    placeholder="e.g. Fiction, Science, History"
                    required
                >
            </div>

            <div class="form-group">
                <label>Description</label>

                <textarea
                    name="description"
                    placeholder="Enter a short description"
                    required
                    style="
                        width: 100%;
                        min-height: 120px;
                        padding: 13px;
                        border: 1px solid #d1d5db;
                        border-radius: 9px;
                        resize: vertical;
                    "
                ></textarea>

            </div>

            <div class="form-group">

                <label>Reading Status</label>

                <select
                    name="status"
                    required
                    style="
                        width: 100%;
                        padding: 13px;
                        border: 1px solid #d1d5db;
                        border-radius: 9px;
                        background: white;
                    "
                >

                    <option value="to_read">
                        To Read
                    </option>

                    <option value="reading">
                        Reading
                    </option>

                    <option value="completed">
                        Completed
                    </option>

                </select>

            </div>

            <button class="btn" type="submit">
                Add Book
            </button>

        </form>

    </div>

</div>

{% endblock %}
