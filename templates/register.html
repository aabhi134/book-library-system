{% extends "base.html" %}

{% block content %}

<style>
    .auth-page {
        min-height: 80vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 40px 20px;
    }

    .auth-card {
        width: 100%;
        max-width: 440px;
        background: white;
        padding: 40px;
        border-radius: 20px;
        box-shadow: 0 10px 40px rgba(0,0,0,0.08);
    }

    .auth-logo {
        width: 55px;
        height: 55px;
        background: #111827;
        color: white;
        border-radius: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 27px;
        margin: 0 auto 20px;
    }

    .auth-card h1 {
        text-align: center;
        margin: 0;
        color: #111827;
        font-size: 28px;
    }

    .subtitle {
        text-align: center;
        color: #6b7280;
        margin: 10px 0 30px;
    }

    .form-group {
        margin-bottom: 17px;
    }

    .form-group label {
        display: block;
        margin-bottom: 7px;
        font-weight: 600;
        color: #374151;
        font-size: 14px;
    }

    .form-group input {
        width: 100%;
        box-sizing: border-box;
        padding: 13px 14px;
        border: 1px solid #d1d5db;
        border-radius: 10px;
        font-size: 15px;
        outline: none;
    }

    .form-group input:focus {
        border-color: #4f46e5;
        box-shadow: 0 0 0 3px rgba(79,70,229,0.1);
    }

    .register-btn {
        width: 100%;
        border: none;
        background: #111827;
        color: white;
        padding: 14px;
        border-radius: 10px;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        margin-top: 5px;
    }

    .register-btn:hover {
        background: #374151;
    }

    .login-link {
        text-align: center;
        margin-top: 25px;
        color: #6b7280;
        font-size: 14px;
    }

    .login-link a {
        color: #4f46e5;
        text-decoration: none;
        font-weight: 700;
    }

    .messages {
        margin-bottom: 18px;
    }

    .message {
        background: #fef2f2;
        color: #dc2626;
        padding: 11px 13px;
        border-radius: 8px;
        font-size: 13px;
        margin-bottom: 8px;
    }
</style>


<div class="auth-page">

    <div class="auth-card">

        <div class="auth-logo">
            📚
        </div>

        <h1>Create Account</h1>

        <p class="subtitle">
            Start building your personal book library
        </p>


        {% if messages %}

            <div class="messages">

                {% for message in messages %}

                    <div class="message">
                        {{ message }}
                    </div>

                {% endfor %}

            </div>

        {% endif %}


        <form method="POST">

            {% csrf_token %}


            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Choose a username"
                    required
                >

            </div>


            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    required
                >

            </div>


            <button type="submit" class="register-btn">
                Create Account
            </button>

        </form>


        <div class="login-link">

            Already have an account?

            <a href="{% url 'login' %}">
                Sign in
            </a>

        </div>

    </div>

</div>

{% endblock %}
