<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}BookNest{% endblock %}
    </title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7fb;
            color: #111827;
        }

        /* NAVBAR */

        .navbar {
            height: 70px;
            background: white;
            border-bottom: 1px solid #e5e7eb;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 6%;

            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;

            text-decoration: none;
            color: #111827;

            font-size: 21px;
            font-weight: 800;
        }

        .brand-icon {
            width: 38px;
            height: 38px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #111827;
            color: white;

            border-radius: 10px;

            font-size: 19px;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .welcome {
            color: #6b7280;
            font-size: 14px;
        }

        .logout {
            text-decoration: none;
            color: #dc2626;

            padding: 8px 14px;

            border-radius: 8px;

            font-size: 14px;
            font-weight: 600;

            background: #fef2f2;
        }

        .logout:hover {
            background: #fee2e2;
        }

        .login-nav {
            text-decoration: none;
            color: #4f46e5;

            padding: 8px 14px;

            border-radius: 8px;

            font-size: 14px;
            font-weight: 600;

            background: #eef2ff;
        }

        /* MESSAGES */

        .messages-container {
            max-width: 1200px;
            margin: 15px auto 0;
            padding: 0 20px;
        }

        .message {
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 10px;
            font-size: 14px;
        }

        .message.success {
            background: #ecfdf5;
            color: #047857;
            border: 1px solid #a7f3d0;
        }

        .message.error {
            background: #fef2f2;
            color: #b91c1c;
            border: 1px solid #fecaca;
        }

        .message.warning {
            background: #fffbeb;
            color: #b45309;
            border: 1px solid #fde68a;
        }

        .message.info {
            background: #eff6ff;
            color: #1d4ed8;
            border: 1px solid #bfdbfe;
        }

        /* FOOTER */

        footer {
            text-align: center;
            padding: 35px 20px;
            color: #9ca3af;
            font-size: 13px;
        }

        @media (max-width: 650px) {

            .navbar {
                padding: 0 20px;
            }

            .welcome {
                display: none;
            }

            .brand {
                font-size: 18px;
            }

        }

    </style>

</head>


<body>


    <!-- NAVBAR -->

    <nav class="navbar">

        <a href="{% url 'home' %}" class="brand">

            <span class="brand-icon">
                📚
            </span>

            BookNest

        </a>


        <div class="nav-right">

            {% if user.is_authenticated %}

                <span class="welcome">
                    Hello, {{ user.username }}
                </span>

                <a href="{% url 'logout' %}" class="logout">
                    Logout
                </a>

            {% else %}

                <a href="{% url 'login' %}" class="login-nav">
                    Login
                </a>

            {% endif %}

        </div>

    </nav>


    <!-- DJANGO MESSAGES -->

    {% if messages %}

        <div class="messages-container">

            {% for message in messages %}

                <div class="message {{ message.tags }}">
                    {{ message }}
                </div>

            {% endfor %}

        </div>

    {% endif %}


    <!-- PAGE CONTENT -->

    {% block content %}

    {% endblock %}


    <!-- FOOTER -->

    <footer>

        © 2026 BookNest · Personal Book Library

    </footer>


</body>

</html>
